# ============================================================================
#  Uji otomatis - Portal Manajemen RW 26
# ============================================================================
#  Menjalankan pengujian setiap kali ada perubahan yang di-push ke main.
#
#  TIDAK MEMBUTUHKAN SATU PUN SECRET.
#
#  Pengujian SQL memakai embedded-postgres, yaitu binary PostgreSQL sungguhan
#  yang diunduh ke dalam runner. Karena database-nya sementara dan lokal,
#  tidak ada kredensial Supabase yang perlu disimpan di GitHub Secrets.
#
#  Kuncinya: skrip migrasi (migrate.mjs) SENGAJA tidak dijalankan di sini.
#  Migrasi menulis ke database produksi dan membaca Google Sheets, jadi itu
#  harus tetap dilakukan manual oleh manusia.
# ============================================================================
name: Uji

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hanya satu yang boleh jalan sekaligus. Menghemat kuota menit runner, dan
# tidak ada gunanya menjalankan pengujian yang sama dua kali.
concurrency:
  group: uji-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uji:
    name: Pengujian
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: supabase/tools

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: supabase/tools/package-lock.json

      # `node --check` tidak butuh satu pun dependensi npm, jadi pemeriksaan ini
      # SENGAJA dijalankan sebelum `npm ci`.
      #
      # CATATAN: embedded-postgres@beta bisa gagal terpasang di runner. Kalau
      # `npm ci` berada di depan, kegagalan itu menghentikan pipeline dan
      # pemeriksaan sintaks TIDAK PERNAH jalan - persis celah yang membiarkan
      # assets/js/rw26-api.js rusak sintaks sampai ke produksi.
      - name: Periksa sintaks semua berkas JavaScript
        run: |
          set -e
          gagal=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "::error file=$f::sintaks tidak valid"
              gagal=1
            fi
          done < <(find ../.. -name '*.mjs' -not -path '*/node_modules/*')
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "::error file=$f::sintaks tidak valid"
              gagal=1
            fi
          done < <(find ../.. -name '*.js' -not -path '*/node_modules/*' -not -path '*/pgdata/*')
          exit $gagal

      - name: Pasang dependensi
        run: npm ci

      - name: Uji fungsi parsing dan tanggal
        run: node test-lib.mjs

      - name: Uji transformasi data dari Sheets
        run: node test-migrate.mjs

      - name: Uji deteksi private key
        run: node test-privkey.mjs

      - name: Periksa sintaks skrip inline di HTML
        # Langkah di atas hanya menemukan *.js dan *.mjs. Isi <script> di
        # dalam .html sama sekali tidak ikut diperiksa - padahal login.html
        # dan update-password.html masing-masing ratusan baris JavaScript.
        # Satu karakter yang salah ketik akan merusak seluruh halaman tanpa
        # build yang gagal.
        run: node cek-inline.mjs

      - name: Cari karakter asing yang menyusup ke teks
        # Komentar dan pesan di repo ini ditulis dalam Bahasa Indonesia.
        # Karakter dari aksara lain (Han, Cyrillic) kadang ikut terbawa ke
        # dalam kata Indonesia dan tidak akan pernah ditemukan oleh grep
        # biasa. Contoh nyata yang sudah pernah ada di repo ini dirinci di
        # kepala cek-asing.mjs.
        run: node cek-asing.mjs

      - name: Cari karakter kontrol yang tersembunyi di teks
        # Menyalin dan menempel kadang menyisakan karakter kontrol seperti
        # U+0008 BACKSPACE di dalam kata. Contoh nyata yang sudah ada di
        # assets/js/rw26-api.js: huruf 'b' pada "berita" tergantikan backspace,
        # dan teksnya tetap terbaca benar di editor.
        #
        # Kalau yang sampai ke dalam string literal, kode yang terlihat benar
        # bisa jadi tidak sama sekali saat dijalankan. TAB, LF, dan CR
        # dikecualikan karena normal di berkas teks.
        run: node cek-kontrol.mjs

      - name: Cari mojibake (teks UTF-8 yang salah dibaca)
        # Tanda baca UTF-8 yang dibaca sebagai cp1252 berubah jadi beberapa
        # karakter aneh yang TETAP SAH secara sintaks: `—` (E2 80 94) jadi
        # tiga karakter, `·` (C2 B7) jadi dua. node --check tetap lulus, dan
        # cek-asing tidak melaporkannya karena karakter hasilnya ada di
        # allowlist - padahal tampilannya rusak di layar.
        run: node cek-mojibake.mjs

      - name: Pastikan akhir baris tiap berkas konsisten
        # `core.autocrlf=true` di Windows membuat git menormalkan sendiri, tapi
        # berkas yang CAMPUR (sebagian CRLF, sebagian LF) tidak pernah
        # dirapikan di kedua arah. Yang muncul hanya karena alat penyunting
        # menulis LF pada baris yang disentuh.
        run: node samakan-akhir-baris.mjs

      - name: Pastikan setiap handler inline punya definisi
        # index.html dibungkus `(async () => { ... })()`. Setiap `function`
        # di dalam IIFE itu TIDAK menjadi properti window, sementara atribut
        # `onclick="nukaFungsi()"` dieksekusi browser sebagai kode global.
        # Kalau namanya tidak diekspor, browser melempar ReferenceError dan
        # handler itu diam-diam tidak pernah jalan.
        #
        # Gejalanya persis seperti "dropdownnya tidak muncul": <select> bulan
        # dan tahun ada di markup tapi isinya kosong, karena <option>-nya
        # dibuat oleh fungsi yang tidak pernah terpanggil. Tidak ada error di
        # layar - cuma di konsol.
        run: node cek-handler.mjs

      - name: Pastikan setiap id yang dipanggil ada di markup
        # getElementById() mengembalikan null untuk id yang tidak ada, bukan
        # error. Efeknya `null.textContent = ...` yang melempar TypeError di
        # tengah fungsi - dan kalau yang gagal adalah initializer, seluruh
        # tab itu tidak pernah jalan.
        run: node cek-id.mjs

      - name: Uji alur ganti password untuk akun Editor
        # Akun Editor tidak bisa mengubah tabel profiles sendiri, karena RLS
        # membatasi perubahan pada tabel itu untuk Admin. Kalau penanda
        # must_change_pw diturunkan lewat update biasa, akun Editor akan
        # tersangkut di halaman ganti password selamanya - tanpa pesan error.
        run: node test-ganti-password.mjs

      - name: Uji keamanan token reset password mandiri
        # Tiga aksi reset password berjalan TANPA sesi - orang yang minta
        # reset memang belum bisa login. Itu membuat tabel token jadi satu-
        #-satunya permukaan serangan yang terbuka untuk siapa saja. Test ini
        # membuktikan anon dan authenticated tidak bisa menyentuh tabel itu,
        # akun nonaktif tidak dipetakan, token single-use, dan token ikut
        # terhapus bersama akunnya.
        run: node test-reset-token.mjs

      - name: Uji alur keluar-masuk (anti pantulan)
        # Portal yang mengeluarkan pengguna tapi tidak menghapus sesi akan
        # membuat halaman login mengarahkan balik, dan orang yang sama
        # terlempar bolak-balik tanpa henti.
        #
        # Pengujiannya mengambil fungsi penjaga dari login.html lalu
        # mengujinya di seluruh rentang waktu. Tidak memakai DOM dan tidak
        # menunggu waktu, jadi hasilnya sama di komputer mana pun - termasuk
        # runner CI yang lambat.
        run: node test-pantulan.mjs

      - name: Uji aturan pemeriksa kata sandi
        # Kalau aturan ini terlalu longgar, setiap push akan gagal palsu.
        # Kalau terlalu ketat, kebocoran bisa lolos. Dua-duanya diuji.
        run: node test-audit-password.mjs

      - name: Uji seluruh file SQL di PostgreSQL sungguhan
        run: node validate-migrations.cjs

      - name: Cocokkan aksi portal dengan jembatan dan Code.gs
        run: node cek-aksi.mjs

      - name: Pastikan tidak ada berkas terlarang yang ikut ter-track
        # .gitignore hanya berlaku untuk berkas yang BELUM ter-track. Berkas
        # yang sempat ter-commit sebelum .gitignore dibuat akan terus ikut
        # ter-push, apa pun aturannya. Karena itu yang diperiksa adalah daftar
        # berkas yang benar-benar sudah ter-track, bukan isi .gitignore saja.
        run: node audit-gitignore.mjs

      - name: Pastikan tidak ada kunci service_role di berkas yang ter-publish
        run: node cek-rahasia.mjs

      - name: Pastikan file yang tidak boleh di-commit memang ter-ignore
        run: |
          # .env memuat kunci service_role. Kalau sampai ter-commit, seluruh
          # isi database bisa dibaca siapa saja. Hentikan build di sini.
          ignored=$(git check-ignore -q supabase/tools/.env && echo ya || echo tidak)
          if [ "$ignored" = "tidak" ]; then
            echo "::error::supabase/tools/.env tidak ter-ignore. Perbaiki .gitignore."
            exit 1
          fi
          echo "OK: .env ter-ignore."
          if git ls-files --error-unmatch supabase/tools/.env >/dev/null 2>&1; then
            echo "::error::supabase/tools/.env sudah pernah di-commit. Wajib hapus dari riwayat."
            exit 1
          fi
          echo "OK: .env tidak pernah masuk riwayat git."

      - name: Pastikan kredensial Apps Script tidak ada di berkas yang ter-publish
        # Code.gs memang memuat teks 'SUPABASE_SERVICE_ROLE_KEY' sebagai nama
        # Script Property - itu bukan kebocoran. Yang berbahaya adalah NILAI
        # kuncinya, jadi yang diperiksa adalah nilai itu, bukan namanya.
        #
        # cek-rahasia.mjs sudah memindai Code.gs (ekstensi .gs) bersama
        # seluruh berkas lain, jadi tidak perlu grep terpisah di sini.
        run: node cek-rahasia.mjs

      - name: Periksa isi berkas yang sudah tayang di GitHub
        # Lapisan terakhir: menarik isi berkas PERSIS seperti yang tersimpan di
        # server GitHub, lalu memeriksa isinya. Nama berkas yang terlihat bersih
        # bisa tetap menyembunyikan kunci di dalam config.js atau Code.gs.
        run: node audit-github.mjs
